name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r api/requirements.txt
      - run: PYTHONPATH=api SECRET_KEY=test DATABASE_URL=postgresql+asyncpg://x:x@localhost/x REDIS_URL=redis://localhost MINIO_ENDPOINT=localhost MINIO_ACCESS_KEY=x MINIO_SECRET_KEY=x pytest api/tests -q
