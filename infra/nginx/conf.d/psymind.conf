upstream api_upstream { server api:8000; }
upstream web_upstream { server web:3000; }

server {
  listen 80;
  server_name _;
  location /healthz { proxy_pass http://api_upstream/health; }
  location /ready { proxy_pass http://api_upstream/ready; }
  location /ready/ai { proxy_pass http://api_upstream/ready/ai; }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /health { proxy_pass http://api_upstream/health; }
  location = /ready { proxy_pass http://api_upstream/ready; }
  location = /ready/ai { proxy_pass http://api_upstream/ready/ai; }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://api_upstream;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://web_upstream;
  }
}
